{% extends 'base.html' %}{% block c %}
<div class="card p-3 mb-3"><h6>➕ Create Staff Login</h6><form method="post" class="row g-2"><div class="col-md-3"><input class="form-control" name="name" placeholder="Full name" required></div><div class="col-md-3"><input class="form-control" name="username" placeholder="Username" required></div>
<div class="col-md-2"><input class="form-control" type="password" name="password" placeholder="Password (6+)" required></div><div class="col-md-2"><select class="form-select" name="role"><option>doctor</option><option>receptionist</option><option>admin</option></select></div><div class="col-md-2"><button class="btn btn-success w-100">Create</button></div></form></div>
<div class="card p-3"><table class="table align-middle mb-0"><tr><th>Name</th><th>Username</th><th>Role</th><th>Status</th><th></th></tr>
{% for u in rows %}<tr><td>{{ u.name }}</td><td>{{ u.username }}</td><td>{{ u.role }}</td><td>{{ 'Active' if u.active != 0 else 'Disabled' }}</td><td><form method="post"><input type="hidden" name="action" value="toggle"><input type="hidden" name="id" value="{{ u.id }}"><button class="btn btn-sm btn-outline-secondary">{{ 'Disable' if u.active != 0 else 'Enable' }}</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
